<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteio da Fila da Comida - SOBEF</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e65100 0%, #ff9800 50%, #ef6c00 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 20px;
    padding: 30px 40px;
    max-width: 760px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    animation: fadeInUp 0.6s ease;
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .logo-area { text-align: center; margin-bottom: 8px; }
  .logo-text { font-size: 48px; font-weight: 900; letter-spacing: 6px; color: #e65100; text-transform: uppercase; }
  h1 { text-align: center; color: #e65100; margin-bottom: 6px; font-size: 24px; }
  .subtitle { text-align: center; color: #777; margin-bottom: 20px; font-size: 14px; }
  .timestamp { background: #fff3e0; padding: 12px 15px; border-radius: 10px; margin-bottom: 18px; text-align: center; font-size: 14px; color: #333; border: 1px solid #ffe0b2; }
  .timestamp strong { color: #e65100; }
  .result-box { background: #fffaf5; border: 2px solid #ff9800; border-radius: 15px; padding: 22px; margin-bottom: 18px; min-height: 180px; max-height: 420px; overflow-y: auto; position: relative; }
  .result-header { text-align: center; color: #e65100; font-size: 18px; font-weight: bold; margin-bottom: 4px; }
  .result-subheader { text-align: center; color: #999; font-size: 13px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #ff9800; }
  .queue-list { list-style: none; padding: 0; }
  .queue-item { display: flex; align-items: center; padding: 10px 14px; margin-bottom: 7px; background: white; border-radius: 8px; border-left: 4px solid #ff9800; box-shadow: 0 2px 5px rgba(0,0,0,0.08); transition: all 0.25s; opacity: 0; transform: translateX(-20px); animation: slideIn 0.4s ease forwards; }
  @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
  .queue-item:hover { transform: translateX(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
  .queue-item.first { border-left-color: #e65100; background: #fff3e0; }
  .queue-position { background: linear-gradient(135deg, #e65100 0%, #ff9800 100%); color: white; min-width: 48px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; margin-right: 14px; flex-shrink: 0; padding: 0 8px; }
  .queue-item.first .queue-position { background: linear-gradient(135deg, #bf360c 0%, #e65100 100%); }
  .queue-name { font-size: 16px; color: #222; font-weight: 600; }
  .queue-item.first .queue-name { color: #e65100; }
  .empty-state { text-align: center; color: #999; font-size: 16px; font-style: italic; padding: 50px 20px; }
  /* Animação de sorteio (roleta / embaralhamento visual) */
  .shuffle-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; gap: 14px; }
  .shuffle-name { font-size: 26px; font-weight: 800; color: #e65100; background: #fff3e0; padding: 14px 28px; border-radius: 12px; border: 2px dashed #ff9800; animation: pulse 0.15s infinite alternate; min-width: 220px; text-align: center; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
  .shuffle-label { color: #999; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .dice { font-size: 40px; animation: spin 0.6s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* Confete */
  .confetti { position: fixed; top: -10px; width: 10px; height: 10px; z-index: 999; animation: fall linear forwards; border-radius: 2px; }
  @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0.3; } }
  .buttons { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  button { flex: 1; min-width: 120px; padding: 14px 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.25s; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, #e65100 0%, #ff9800 100%); color: white; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(230, 81, 0, 0.45); }
  .btn-copy { background: #ef6c00; color: white; }
  .btn-copy:hover:not(:disabled) { background: #e65100; }
  .btn-secondary { background: #ffe0b2; color: #e65100; }
  .btn-secondary:hover:not(:disabled) { background: #ffcc80; }
  .participants { background: #fff3e0; padding: 18px; border-radius: 10px; border: 1px solid #ffe0b2; }
  .participants-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .participants h3 { color: #e65100; font-size: 16px; }
  .select-actions { display: flex; gap: 8px; }
  .select-actions button { flex: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; background: white; color: #e65100; border: 1px solid #ffcc80; }
  .select-actions button:hover { background: #ffe0b2; }
  .participants-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 7px; }
  .participant { display: flex; align-items: center; gap: 8px; background: white; padding: 7px 11px; border-radius: 5px; font-size: 13px; color: #333; border-left: 3px solid #ff9800; cursor: pointer; transition: all 0.2s; user-select: none; }
  .participant:hover { background: #fff3e0; }
  .participant.disabled { opacity: 0.45; border-left-color: #ccc; text-decoration: line-through; }
  .participant input { accent-color: #e65100; width: 15px; height: 15px; cursor: pointer; }
  .notification { position: fixed; top: 20px; right: 20px; background: #e65100; color: white; padding: 14px 22px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.25); transform: translateX(420px); transition: transform 0.3s; z-index: 1000; font-weight: 600; }
  .notification.show { transform: translateX(0); }
  @media (max-width: 520px) {
    .container { padding: 18px; }
    .logo-text { font-size: 36px; letter-spacing: 4px; }
    h1 { font-size: 20px; }
    .buttons { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-area"><div class="logo-text">SOBEF</div></div>
  <h1>🍽️ Sorteio da Fila da Comida</h1>
  <p class="subtitle">Lista completa de quem esquenta a comida</p>

  <div class="timestamp">
    <strong>📅 Data/Horário:</strong> <span id="currentDateTime"></span>
  </div>

  <div class="result-box" id="resultBox">
    <div class="empty-state">🍲 Selecione os participantes e clique em "Gerar Lista" para sortear a ordem da fila</div>
  </div>

  <div class="buttons">
    <button class="btn-primary" id="btnGerar" onclick="gerarLista()">🎲 Gerar Lista</button>
    <button class="btn-copy" id="btnCopiar" onclick="copiarLista()">📋 Copiar Lista</button>
    <button class="btn-secondary" id="btnLimpar" onclick="limpar()">🗑️ Limpar</button>
  </div>

  <div class="participants">
    <div class="participants-header">
      <h3>👥 Participantes (<span id="totalPart">0</span>/<span id="totalGeral">0</span> selecionados)</h3>
      <div class="select-actions">
        <button onclick="selecionarTodos()">✅ Marcar todos</button>
        <button onclick="selecionarNenhum()">❌ Desmarcar todos</button>
      </div>
    </div>
    <div class="participants-list" id="participantsList"></div>
  </div>
</div>

<div class="notification" id="notification">Lista copiada com sucesso!</div>

<script>
const participantesOriginais = ["DARILO", "FABRICIO", "GLEUCIANE", "NILDETE", "JHON", "LUAN", "ALEANDRA", "DANIEL", "ROGERIO", "JOAO PEDRO", "PAULO", "CARLA", "NAZARENO"];
let selecionados = new Set(participantesOriginais);
let listaSorteada = null;
let dataSorteio = null;
let sorteando = false;

const EMOJIS_POSICAO = ["🥇", "🥈", "🥉"];

function atualizarDataHora() {
  const agora = new Date();
  const data = agora.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const hora = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  document.getElementById('currentDateTime').textContent = `${data} às ${hora}`;
}

function mostrarParticipantes() {
  const lista = document.getElementById('participantsList');
  document.getElementById('totalGeral').textContent = participantesOriginais.length;
  atualizarContador();
  lista.innerHTML = participantesOriginais.map(function(nome) {
    const marcado = selecionados.has(nome);
    return `<label class="participant${marcado ? '' : ' disabled'}" data-nome="${nome}">
      <input type="checkbox" ${marcado ? 'checked' : ''} onchange="toggleParticipante('${nome.replace(/'/g, "\\'")}')">
      <span>${nome}</span>
    </label>`;
  }).join('');
}

function atualizarContador() {
  document.getElementById('totalPart').textContent = selecionados.size;
}

function toggleParticipante(nome) {
  if (selecionados.has(nome)) { selecionados.delete(nome); } else { selecionados.add(nome); }
  atualizarContador();
  const el = document.querySelector(`.participant[data-nome="${nome}"]`);
  if (el) el.classList.toggle('disabled', !selecionados.has(nome));
}

function selecionarTodos() { selecionados = new Set(participantesOriginais); mostrarParticipantes(); }
function selecionarNenhum() { selecionados = new Set(); mostrarParticipantes(); }

function embaralhar(array) {
  const novo = array.slice();
  for (let i = novo.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = novo[i]; novo[i] = novo[j]; novo[j] = tmp;
  }
  return novo;
}

function setBotoesDesabilitados(estado) {
  document.getElementById('btnGerar').disabled = estado;
  document.getElementById('btnCopiar').disabled = estado;
  document.getElementById('btnLimpar').disabled = estado;
}

function gerarLista() {
  if (sorteando) return;
  const participantesAtivos = participantesOriginais.filter(function(n) { return selecionados.has(n); });
  if (participantesAtivos.length === 0) {
    mostrarNotificacao('⚠️ Selecione ao menos 1 participante!', 'warning');
    return;
  }
  sorteando = true;
  setBotoesDesabilitados(true);

  const resultBox = document.getElementById('resultBox');
  resultBox.innerHTML = `
    <div class="shuffle-overlay">
      <div class="dice">🎲</div>
      <div class="shuffle-label">🔀 Sorteando a fila da comida...</div>
      <div class="shuffle-name" id="shuffleName">...</div>
    </div>`;

  const shuffleNameEl = document.getElementById('shuffleName');
  let ciclos = 0;
  const totalCiclos = 18;
  const intervalo = setInterval(function() {
    const aleatorio = participantesAtivos[Math.floor(Math.random() * participantesAtivos.length)];
    shuffleNameEl.textContent = `🍴 ${aleatorio}`;
    ciclos++;
    if (ciclos >= totalCiclos) {
      clearInterval(intervalo);
      finalizarSorteio(participantesAtivos);
    }
  }, 90);
}

function finalizarSorteio(participantesAtivos) {
  listaSorteada = embaralhar(participantesAtivos);
  dataSorteio = new Date();

  let html = `<div class="result-header">🏆 Ordem Sorteada da Fila 🏆</div>`;
  html += `<div class="result-subheader">✨ Que comece o rango! Confira abaixo quem esquenta primeiro 👇</div>`;
  html += `<ol class="queue-list">`;
  listaSorteada.forEach(function(nome, indice) {
    const posicao = indice + 1;
    const classe = posicao === 1 ? 'first' : '';
    const delay = (indice * 0.08).toFixed(2);
    const emoji = EMOJIS_POSICAO[indice] || '🍽️';
    const rotulo = posicao === 1 ? `${emoji} 1º` : `${emoji} ${posicao}º`;
    html += `<li class="queue-item ${classe}" style="animation-delay:${delay}s">
      <div class="queue-position">${rotulo}</div>
      <div class="queue-name">${nome}</div>
    </li>`;
  });
  html += `</ol>`;

  document.getElementById('resultBox').innerHTML = html;
  atualizarDataHora();
  dispararConfete();
  setBotoesDesabilitados(false);
  sorteando = false;
  mostrarNotificacao('🎉 Sorteio concluído! Bom apetite! 🍽️', 'success');
}

function dispararConfete() {
  const cores = ['#e65100', '#ff9800', '#ef6c00', '#ffcc80', '#bf360c'];
  for (let i = 0; i < 60; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti';
    conf.style.left = Math.random() * 100 + 'vw';
    conf.style.background = cores[Math.floor(Math.random() * cores.length)];
    conf.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    conf.style.width = conf.style.height = (6 + Math.random() * 6) + 'px';
    document.body.appendChild(conf);
    setTimeout(function() { conf.remove(); }, 3600);
  }
}

function formatarDataHora(data) {
  const d = data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const h = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  return { data: d, hora: h };
}

function copiarLista() {
  if (!listaSorteada || !dataSorteio) {
    mostrarNotificacao('⚠️ Primeiro gere a lista!', 'warning');
    return;
  }
  const f = formatarDataHora(dataSorteio);
  let texto = `🍽️ SOBEF - SORTEIO DA FILA DA COMIDA 🍽️\n`;
  texto += `━━━━━━━━━━━━━━━━━━━━━━\n`;
  texto += `🏆 Ordem Sorteada da Fila 🏆\n\n`;
  listaSorteada.forEach(function(nome, indice) {
    const emoji = EMOJIS_POSICAO[indice] || '🍽️';
    texto += `${emoji} ${indice + 1}º - ${nome}\n`;
  });
  texto += `\n📅 Data: ${f.data}\n`;
  texto += `⏰ Horário: ${f.hora}\n`;
  texto += `━━━━━━━━━━━━━━━━━━━━━━\n`;
  texto += `🎲 Sorteio realizado em ${f.data} às ${f.hora}. Bom apetite! 🍴`;

  if (navigator.clipboard) {
    navigator.clipboard.writeText(texto)
      .then(function() { mostrarNotificacao('✅ Lista copiada com sucesso!', 'success'); })
      .catch(function() { copiarFallback(texto); });
  } else {
    copiarFallback(texto);
  }
}

function copiarFallback(texto) {
  const ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    mostrarNotificacao('✅ Lista copiada com sucesso!', 'success');
  } catch (e) {
    mostrarNotificacao('❌ Erro ao copiar', 'error');
  }
  document.body.removeChild(ta);
}

function limpar() {
  listaSorteada = null;
  dataSorteio = null;
  document.getElementById('resultBox').innerHTML = `<div class="empty-state">🍲 Selecione os participantes e clique em "Gerar Lista" para sortear a ordem da fila</div>`;
  atualizarDataHora();
}

function mostrarNotificacao(mensagem, tipo) {
  const n = document.getElementById('notification');
  n.textContent = mensagem;
  if (tipo === 'warning') { n.style.background = '#f9a825'; n.style.color = '#222'; }
  else if (tipo === 'error') { n.style.background = '#c62828'; n.style.color = '#fff'; }
  else { n.style.background = '#e65100'; n.style.color = '#fff'; }
  n.classList.add('show');
  setTimeout(function() { n.classList.remove('show'); }, 3000);
}

atualizarDataHora();
mostrarParticipantes();
setInterval(atualizarDataHora, 1000);
</script>
</body>
</html>
